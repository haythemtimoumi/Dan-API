name: Deploy Node.js App to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy Node.js app to VPS
      run: |
        ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          set -e

          # Remove old Node.js v12 and conflicting dev packages
          apt-get remove -y nodejs libnode-dev || true

          # Clean up any broken packages
          apt-get autoremove -y
          apt-get autoclean -y

          # Install Node.js v22 from NodeSource
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs

          # Confirm version
          node -v
          npm -v

          cd /root/Dan-API
          git pull origin main

          npm install
          npm run build

          # Kill any existing `npm run dev` process
          pkill -f "npm run dev" || true

          # Run in background
          nohup npm run dev > app.log 2>&1 &
        EOF