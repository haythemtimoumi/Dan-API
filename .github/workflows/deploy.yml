name: Deploy Node.js App to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy Node.js app to VPS using PM2
      run: |
        ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          set -e

          cd /root/Dan-API
          git pull origin main

          npm install
          npm run build

          # Install pm2 if not installed
          if ! command -v pm2 &> /dev/null
          then
            npm install -g pm2
          fi

          # Start or restart PM2 process (always safely update env/code)
          pm2 start npm --name dan-api -- run start --update-env

          # Save PM2 process list after every deployment
          pm2 save
        EOF
